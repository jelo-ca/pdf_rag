[tool.pylint.master]
jobs = 1

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "fixme",
    "R0801",
    "import-error",
]

[tool.pylint.basic]
good-names = ["i", "j", "k", "n", "e", "f", "v", "x", "y", "z", "_"]

[tool.isort]
profile = "black"
line_length = 120
known_third_party = [
    "fitz",
    "llama_index",
    "llama_cpp",
    "pytesseract",
    "PIL",
    "gradio",
    "torch",
    "sentence_transformers",
]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
